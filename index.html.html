const snd=()=>'<button class="btn secondary small" onclick="speakW(false)">'+tt('ex.listen')+'</button>';
function cardEx(w){shell(`<span class="muted">${tt('ex.cardp')}</span><div class="exercise-word">${esc(w[0])}</div>${snd()}<div id="back" class="hidden"><div style="font-size:24px;margin:16px 0">${esc(w[1])}</div><div class="muted">${esc(firstSent(w))}</div></div><div class="actions" style="justify-content:center;margin-top:18px"><button class="btn" id="flip" onclick="$('back').classList.remove('hidden');$('flip').classList.add('hidden');$('kn').classList.remove('hidden')">${tt('ex.show')}</button></div><div id="kn" class="actions hidden" style="justify-content:center"><button class="btn soft" onclick="rate(cur(),false);nextExercise()">${tt('ex.dk')}</button><button class="btn" onclick="rate(cur(),true);nextExercise()">${tt('ex.kn')}</button></div>`);speakW(false)}
function choiceEx(w){optList=shuf([...shuf([...new Set(allW().map(x=>x[1]).filter(t=>t&&t!==w[1]))]).slice(0,3),w[1]]);shell(`<span class="muted">${tt('ex.pick')}</span><div class="exercise-word">${esc(w[0])}</div>${snd()}<div class="grid" style="margin-top:18px">${optList.map((t,k)=>`<button class="btn secondary" id="o${k}" onclick="pickOpt(${k})">${esc(t)}</button>`).join('')}</div>`);speakW(false)}
function pickOpt(k){let w=cur(),ok=optList[k]===w[1];$('o'+k).style.background=ok?'#d8f3e0':'#fbd5d5';finish(w,ok,tt('ex.right')+'<b>'+esc(w[1])+'</b>')}
function tfEx(w){let o=[...new Set(allW().map(x=>x[1]).filter(t=>t&&t!==w[1]))];tfOk=Math.random()<.5;let t=tfOk?w[1]:o[Math.floor(Math.random()*o.length)];shell(`<span class="muted">${tt('ex.tfq')}</span><div class="exercise-word">${esc(w[0])}</div><div style="font-size:24px;margin:10px 0 20px">= ${esc(t)}</div>${snd()}<div class="actions" style="justify-content:center;margin-top:16px"><button class="btn soft" onclick="tfAns(false)">${tt('ex.no')}</button><button class="btn" onclick="tfAns(true)">${tt('ex.yes')}</button></div>`)}
function tfAns(a){finish(cur(),a===tfOk,tt('ex.rtr')+'<b>'+esc(cur()[1])+'</b>')}
function orderEx(w){ordS=shuf(firstSent(w).split(/\s+/).map((t,i)=>({t,i})));ordB=[];ordDraw()}
function ordDraw(){let w=cur();shell(`<span class="muted">${tt('ex.build',esc(w[1]))}</span><div style="min-height:54px;border-bottom:1px solid var(--line);margin:18px 0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center">${ordB.map((c,k)=>`<button class="btn soft small" onclick="ordBack(${k})">${esc(c.t)}</button>`).join('')}</div><div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center">${ordS.map((c,k)=>`<button class="btn secondary small" onclick="ordAdd(${k})">${esc(c.t)}</button>`).join('')}</div><div class="actions" style="justify-content:center;margin-top:18px"><button class="btn" onclick="ordCheck()">${tt('ex.check')}</button></div>`)}
function ordAdd(k){if(answered)return;ordB.push(ordS.splice(k,1)[0]);ordDraw()}
function ordBack(k){if(answered)return;ordS.push(ordB.splice(k,1)[0]);ordDraw()}
function ordCheck(){let w=cur(),s=firstSent(w).split(/\s+/).join(' ');finish(w,ordB.map(c=>c.t).join(' ')===s,tt('ex.rt')+'<b>'+esc(s)+'</b>')}
const rec=(w,ok)=>recordAnswer(w,ok,exMode);
function boardDone(){return bdone.size===bw.length?`<div class="feedback" style="margin-top:16px">${tt('ex.pairsdone')}<br><button class="btn small" style="margin-top:10px" onclick="activeI+=bw.length-1;nextExercise()">${tt('ex.next')}</button></div>`:''}
function board(m){exMode=m;bw=activeWords.slice(activeI,activeI+(m==='memory'?6:5));bsel=null;bdone=new Set();bbad=new Set();exStart=Date.now();
if(m==='matching'){bR=shuf(bw.map((w,k)=>({k,t:w[1]||'—'})));matchDraw()}else{mem=shuf([...bw.map((w,k)=>({k,t:w[0],s:'w'})),...bw.map((w,k)=>({k,t:w[1]||'—',s:'t'}))]);mopen=[];memDraw()}}
function tile(c,S){let d=bdone.has(c.k),sel=bsel&&bsel.s===S&&bsel.k===c.k;return`<button class="btn ${d?'soft':sel?'':'secondary'}" ${d?'disabled':''} onclick="mPick('${S}',${c.k})">${esc(c.t)}</button>`}
function matchDraw(){shell(`<span class="muted">${tt('ex.match')}</span><div class="grid two" style="margin-top:16px;gap:10px"><div class="grid" style="gap:8px">${bw.map((w,k)=>tile({k,t:w[0]},'L')).join('')}</div><div class="grid" style="gap:8px">${bR.map(c=>tile(c,'R')).join('')}</div></div>${boardDone()}`)}
function mPick(S,k){if(bsel&&bsel.s!==S){let lk=S==='L'?k:bsel.k;if(bsel.k===k){bdone.add(k);if(!bbad.has(bw[k]))rec(bw[k],true);speakIn(wordDeck.get(bw[k])??activeDeckI,bw[k][0])}else if(!bbad.has(bw[lk])){bbad.add(bw[lk]);rec(bw[lk],false)}bsel=null}else bsel={s:S,k};matchDraw()}
function memDraw(){shell(`<span class="muted">${tt('ex.mem')}</span><div id="memgrid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px">${mem.map((c,i)=>{let sh=bdone.has(c.k)||mopen.includes(i);return`<button class="btn ${bdone.has(c.k)?'soft':sh?'':'secondary'}" style="min-height:64px;font-size:13px" onclick="mFlip(${i})">${sh?esc(c.t):'?'}</button>`}).join('')}</div>${boardDone()}`)}
function mFlip(i){let c=mem[i];if(mopen.length>=2||mopen.includes(i)||bdone.has(c.k))return;mopen.push(i);if(c.s==='w')speakIn(wordDeck.get(bw[c.k])??activeDeckI,c.t);
if(mopen.length<2)return memDraw();let[a,b]=mopen.map(x=>mem[x]);
if(a.k===b.k&&a.s!==b.s){bdone.add(a.k);if(!bbad.has(bw[a.k]))rec(bw[a.k],true);mopen=[];memDraw()}
else{[a,b].forEach(x=>{if(!bbad.has(bw[x.k])){bbad.add(bw[x.k]);rec(bw[x.k],false)}});memDraw();setTimeout(()=>{if($('memgrid')){mopen=[];memDraw()}},900)}}
const SAMPLE={pt:'Olá, tudo bem?',ru:'Привет, как дела?',en:'Hello, how are you?',es:'Hola, ¿cómo estás?',fr:'Bonjour, comment ça va ?',de:'Hallo, wie geht es dir?',it:'Ciao, come stai?'},VL={pt:'pt-BR',ru:'ru-RU',en:'en-US',es:'es-ES',fr:'fr-FR',de:'de-DE',it:'it-IT'};
function voicePanel(){let L=[['pt','Португальский'],['ru','Русский'],['en','Английский'],['es','Испанский'],['fr','Французский'],['de','Немецкий'],['it','Итальянский']],h=L.map(([p,n])=>{let vs=voices.filter(v=>v.lang.replace('_','-').toLowerCase().startsWith(p)),sv=localStorage.getItem('nh_v_'+p)||'';if(!vs.length)return'';return`<div class="setting"><div><b>${tt('v.title',ln(n))}</b><div class="muted">${tt('v.avail',vs.length)}</div></div><div class="actions"><select class="field" style="width:210px" onchange="setVoice('${p}',this.value)"><option value="">${tt('v.auto')}</option>${vs.map(v=>`<option value="${esc(v.voiceURI)}" ${v.voiceURI===sv?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select><button class="btn soft small" onclick="testVoice('${p}')">🔊</button></div></div>`}).join('');return h||'<div class="setting"><div><b>'+tt('v.none')+'</b><div class="muted">'+tt('v.nonep')+'</div></div></div>'}
function setVoice(p,u){u?localStorage.setItem('nh_v_'+p,u):localStorage.removeItem('nh_v_'+p);testVoice(p)}
function testVoice(p){speak(SAMPLE[p],VL[p])}
function initUI(){initLock();applyStatic()}



const modes=[['cards','▤'],['typing','⌨'],['listening','♫'],['translation','⇄'],['cloze','▣'],['matching','⌘'],['ordering','☷'],['choice','ⓕ'],['memory','▦'],['truefalse','✓'],['mixed','✧'],['dictation','♬']];
function practicePage(v){v.innerHTML=`<div class="pagehead"><div><h2>${tt('nav.practice')}</h2><span class="muted">${tt('pr.sub')}</span></div><select class="field" style="max-width:220px" id="practiceDeck"><option value="*">${tt('pr.alldecks')}</option>${decks.map(d=>`<option>${esc(d.name)}</option>`).join('')}</select></div>${smartPanel()}<div class="grid practice-grid">${modes.map(([id,ic])=>`<button class="practice-tile" onclick="startPractice('${id}')"><span class="pico">${ic}</span><strong>${tt('mode.'+id+'.t')}</strong><span class="muted">${tt('mode.'+id+'.s')}</span></button>`).join('')}</div><div class="panel" style="margin-top:17px"><h2>${tt('pr.settings')}</h2><div class="toolbar"><label class="muted">${tt('pr.qty')}　<select id="qty" class="field" style="width:110px;display:inline-block"><option>10</option><option selected>20</option><option>30</option><option>50</option></select></label><label class="muted">${tt('dict.level')}　<select id="difficulty" class="field" style="width:150px;display:inline-block">${['Все','Новые','На повторение','Сложные'].map(k=>`<option value="${k}">${tt('pr.f.'+k)}</option>`).join('')}</select></label><button class="btn" onclick="startPractice('mixed')">${tt('pr.mixed')}</button></div></div>`}
let activeWords=[],activeMode='typing',activeI=0;




function nextExercise(){activeI++;if(activeI>=activeWords.length){document.getElementById('view').innerHTML=`<div class="panel center"><div style="font-size:42px;color:var(--pink)">✓</div><h2>${tt('pr.done')}</h2><p class="muted">${tt('pr.donen',activeWords.length)}</p><button class="btn" onclick="showPage('practice')">${tt('pr.backto')}</button></div>`;return}renderExercise()}
function settingsPage(v){v.innerHTML=`<div class="pagehead"><div><h2>${tt('nav.settings')}</h2><span class="muted">${tt('set.sub')}</span></div></div><div class="panel"><div class="tabs"><button class="tab active">${tt('set.general')}</button><button class="tab" onclick="document.getElementById('voice').scrollIntoView({behavior:'smooth'})">${tt('set.learning')}</button><button class="tab" onclick="document.getElementById('voice').scrollIntoView({behavior:'smooth'})">${tt('set.voice')}</button><button class="tab">${tt('nav.account')}</button><button class="tab">${tt('set.sync')}</button></div><div class="setting"><div><b>${tt('set.lang')}</b><div class="muted">${tt('set.langd')}</div></div><select class="field" style="width:170px" onchange="setLang(this.value)">${LNAMES.map(([c,n])=>`<option value="${c}" ${c===LANG?'selected':''}>${n}</option>`).join('')}</select></div><div class="setting"><div><b>${tt('set.theme')}</b><div class="muted">${tt('set.themed')}</div></div><div class="swatches"></div></div><div id="voice">${voicePanel()}</div><div class="setting"><div><b>${tt('set.rate')}</b><div class="muted">${tt('set.rated')} <span id="rateLabel">1.0×</span></div></div><input type="range" min=".65" max="1.25" step=".05" value="${localStorage.getItem('nh_rate')||1}" oninput="localStorage.setItem('nh_rate',this.value);document.getElementById('rateLabel').textContent=Number(this.value).toFixed(2)+'×'"></div><div class="setting"><div><b>${tt('set.auto')}</b><div class="muted">${tt('set.autod')}</div></div><input class="switch" type="checkbox" ${localStorage.getItem('nh_auto')!=='0'?'checked':''} onchange="localStorage.setItem('nh_auto',this.checked?'1':'0')"></div><div class="setting"><div><b>${tt('set.trans')}</b><div class="muted">${tt('set.transd')}</div></div><input class="switch" type="checkbox"></div><div class="setting"><div><b>${tt('set.ex')}</b><div class="muted">${tt('set.exd')}</div></div><input class="switch" type="checkbox" checked></div></div>
<div class="panel" style="margin-top:16px"><h2>${tt('set.data')}</h2><p class="muted">${tt('set.datap')}</p><div class="actions"><button class="btn secondary" onclick="exportData()">${tt('set.backup')}</button><label class="btn secondary" style="cursor:pointer">${tt('set.load')}<input type="file" accept=".json" hidden onchange="importData(event)"></label><button class="btn soft" onclick="changePw()">${tt('set.chpw')}</button><button class="btn soft" onclick="lockNow()">${tt('set.lock')}</button></div></div>`;renderSwatches()}

initUI();showPage('home');
if('serviceWorker'in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
